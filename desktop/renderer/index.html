<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AI 사수</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <section id="panel" class="hit" hidden>
    <header>
      <strong id="panel-title">사수와 대화</strong>
      <select id="repo" title="어느 저장소 이야기인지"></select>
      <button id="notices-btn" title="지나간 알림 다시 보기">알림<span id="badge" hidden></span></button>
      <button id="new-chat" title="새 대화">새 대화</button>
      <button id="back" title="뒤로 (Esc)" hidden>← 뒤로</button>
      <button id="close" title="닫기">✕</button>
    </header>
    <div id="notice" hidden></div>
    <div id="log"></div>
    <div id="review-bar" hidden>
      <button id="open-pr">PR 열기</button>
    </div>
    <form id="ask">
      <textarea id="input" rows="2" placeholder="사수에게 물어보기 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
      <button type="submit">보내기</button>
    </form>
    <footer id="left"></footer>
  </section>

  <div id="bubble" class="hit" hidden></div>

  <div id="buddy" class="hit" data-mood="idle" title="누르면 대화 · 끌면 이동">
    <img id="custom" alt="" hidden>
    <svg id="sasu" viewBox="0 0 120 132" aria-label="사수">
      <!-- 그림자 -->
      <ellipse cx="60" cy="126" rx="30" ry="4" fill="rgba(0,0,0,.18)"/>
      <g id="body-all">
        <!-- 새싹 -->
        <g id="sprout">
          <path d="M60 24 C60 16 60 12 61 8" stroke="#3F7D32" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M61 10 C66 2 76 3 78 6 C74 12 66 13 61 10 Z" fill="#6BBF59" stroke="#3F7D32" stroke-width="2"/>
          <path d="M60 13 C55 7 47 8 45 11 C49 16 56 16 60 13 Z" fill="#8BD173" stroke="#3F7D32" stroke-width="2"/>
        </g>
        <!-- 발 -->
        <rect x="38" y="112" width="16" height="9" rx="4.5" fill="#E08E1F" stroke="#4A2E14" stroke-width="2.5"/>
        <rect x="66" y="112" width="16" height="9" rx="4.5" fill="#E08E1F" stroke="#4A2E14" stroke-width="2.5"/>
        <!-- 몸 -->
        <path d="M60 22 C88 22 102 44 102 72 C102 100 86 116 60 116 C34 116 18 100 18 72 C18 44 32 22 60 22 Z"
              fill="#F4A940" stroke="#4A2E14" stroke-width="3"/>
        <ellipse cx="60" cy="92" rx="26" ry="18" fill="#FFD58A"/>
        <!-- 사원증 -->
        <path d="M48 70 L60 84 L72 70" stroke="#3B5BA9" stroke-width="2.5" fill="none"/>
        <rect x="49" y="84" width="22" height="15" rx="3" fill="#fff" stroke="#3B5BA9" stroke-width="2"/>
        <text x="60" y="95" text-anchor="middle" font-size="8" font-weight="700" fill="#3B5BA9">사수</text>
        <!-- 볼 -->
        <ellipse class="cheek" cx="30" cy="66" rx="6" ry="3.5" fill="#F27C6B" opacity=".55"/>
        <ellipse class="cheek" cx="90" cy="66" rx="6" ry="3.5" fill="#F27C6B" opacity=".55"/>

        <!-- 눈: 평소 / 생각 -->
        <g class="part s-idle s-warn">
          <g class="blink"><circle cx="45" cy="52" r="4.2" fill="#2B1B0E"/><circle cx="75" cy="52" r="4.2" fill="#2B1B0E"/>
          <circle cx="46.5" cy="50.5" r="1.4" fill="#fff"/><circle cx="76.5" cy="50.5" r="1.4" fill="#fff"/></g>
        </g>
        <g class="part s-thinking">
          <circle cx="48" cy="48" r="4.2" fill="#2B1B0E"/><circle cx="78" cy="48" r="4.2" fill="#2B1B0E"/>
        </g>
        <g class="part s-happy" stroke="#2B1B0E" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M39 54 Q45 46 51 54"/><path d="M69 54 Q75 46 81 54"/>
        </g>
        <g class="part s-sleep" stroke="#2B1B0E" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M39 52 Q45 57 51 52"/><path d="M69 52 Q75 57 81 52"/>
        </g>
        <!-- 안경 -->
        <g fill="rgba(255,255,255,.28)" stroke="#2B2B2B" stroke-width="3">
          <circle cx="45" cy="52" r="13"/><circle cx="75" cy="52" r="13"/>
        </g>
        <path d="M58 51 Q60 48 62 51" stroke="#2B2B2B" stroke-width="3" fill="none"/>
        <path d="M32 50 L20 46 M88 50 L100 46" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
        <!-- 눈썹: 경고 -->
        <g class="part s-warn" stroke="#4A2E14" stroke-width="3" stroke-linecap="round">
          <path d="M36 35 L52 40"/><path d="M84 35 L68 40"/>
        </g>
        <!-- 입 -->
        <path class="part s-idle" d="M53 72 Q60 78 67 72" stroke="#4A2E14" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle class="part s-thinking" cx="62" cy="74" r="3.2" fill="#4A2E14"/>
        <path class="part s-warn" d="M51 75 Q55 71 60 75 Q65 79 69 75" stroke="#4A2E14" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="part s-happy" d="M50 70 Q60 70 70 70 Q68 82 60 82 Q52 82 50 70 Z" fill="#7A2E1A" stroke="#4A2E14" stroke-width="2.5"/>
        <path class="part s-sleep" d="M56 74 L64 74" stroke="#4A2E14" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- 효과 -->
      <g class="part s-thinking fx-dots" fill="#4A2E14">
        <circle cx="94" cy="18" r="3"/><circle cx="104" cy="14" r="3"/><circle cx="114" cy="10" r="3"/>
      </g>
      <g class="part s-warn">
        <circle cx="103" cy="20" r="11" fill="#E5484D" stroke="#4A2E14" stroke-width="2.5"/>
        <rect x="101" y="12" width="4" height="10" rx="2" fill="#fff"/><circle cx="103" cy="26" r="2.2" fill="#fff"/>
      </g>
      <g class="part s-happy fx-spark" fill="#FFC93C" stroke="#B07A00" stroke-width="1.5">
        <path d="M100 12 L103 20 L111 23 L103 26 L100 34 L97 26 L89 23 L97 20 Z"/>
        <path d="M14 26 L16 31 L21 33 L16 35 L14 40 L12 35 L7 33 L12 31 Z"/>
      </g>
      <g class="part s-sleep fx-z" fill="#5B6B8C" font-weight="800">
        <text x="92" y="26" font-size="12">z</text><text x="102" y="16" font-size="16">Z</text>
      </g>
    </svg>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
